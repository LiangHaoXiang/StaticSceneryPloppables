<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 地板：等轴测四边形（比方块大，占据画面下半部） -->
  <path d="M12 10.6 22.2 16.1 12 21.6 1.8 16.1 12 10.6Z" fill="#2e6b4e"/>
  <path d="M12 10.6 22.2 16.1 12 21.6 1.8 16.1 12 10.6Z" stroke="#7fe0a8" stroke-width="1" stroke-linejoin="round"/>

  <!-- 地板周边装饰：绿植 / 花盆 / 小道具 -->
  <circle cx="5.6" cy="16.9" r="1.05" fill="#9be8b8"/>
  <circle cx="18.6" cy="16.6" r="0.95" fill="#f0c96a"/>
  <circle cx="8.9" cy="19.6" r="0.8" fill="#cdeee0"/>
  <rect x="14.2" y="18.9" width="1.5" height="1.5" rx="0.35" fill="#e9a86b" transform="rotate(45 14.95 19.65)"/>

  <!-- 立方体：下移贴近地板中心 -->
  <path d="M12 5.6 15.5 7.5 12 9.4 8.5 7.5 12 5.6Z" fill="#f2fafe"/>
  <path d="M8.5 7.5 12 9.4V14.4L8.5 12.5V7.5Z" fill="#bcdcef"/>
  <path d="M15.5 7.5 12 9.4V14.4l3.5-1.9V7.5Z" fill="#8fbcd8"/>

  <!-- 棱线 -->
  <path d="M12 5.6 12 9.4M8.5 7.5 12 9.4l3.5-1.9M12 9.4V14.4" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round" opacity="0.9"/>
</svg>
