<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="78%">
      <stop offset="0" stop-color="#1a2433"/>
      <stop offset="0.62" stop-color="#111823"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="24" height="24" fill="url(#bg)"/>

  <!-- 地板：等轴测四边形 -->
  <path d="M12 10.6 22.2 16.1 12 21.6 1.8 16.1 12 10.6Z" fill="#2e6b4e" stroke="#7fe0a8" stroke-width="0.26" stroke-linejoin="round"/>

  <!-- 地板周边装饰：绿植 / 花盆 / 小道具 / 长凳 -->
  <circle cx="5.6" cy="16.9" r="1.05" fill="#9be8b8"/>
  <circle cx="18.6" cy="16.6" r="0.95" fill="#f0c96a"/>
  <circle cx="8.9" cy="19.6" r="0.8" fill="#cdeee0"/>
  <path d="M14.95 18.77 16.18 19.65 14.95 20.53 13.72 19.65Z" fill="#e9a86b"/>

  <!-- 方块在地板上的柔和投影 -->
  <ellipse cx="12" cy="15.4" rx="3.1" ry="1.25" fill="url(#shade)"/>

  <!-- 立方体 -->
  <path d="M8.5 7.5 12 9.4V14.4L8.5 12.5V7.5Z" fill="#bcdcef"/>
  <path d="M15.5 7.5 12 9.4V14.4l3.5-1.9V7.5Z" fill="#8fbcd8"/>
  <path d="M12 5.6 15.5 7.5 12 9.4 8.5 7.5 12 5.6Z" fill="#f2fafe"/>

  <!-- 棱线（大尺寸下按比例细化） -->
  <g stroke="#ffffff" stroke-width="0.13" stroke-linejoin="round" opacity="0.92" fill="none">
    <path d="M12 5.6V9.4"/>
    <path d="M8.5 7.5 12 9.4 15.5 7.5"/>
    <path d="M12 9.4V14.4"/>
  </g>
</svg>
